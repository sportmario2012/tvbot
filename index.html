<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Segnale — TV Italiana con Loghi</title>
  <script src="https://telegram.org"></script>
  <style>
    :root {
      --bg-color: #f0f2f5;
      --text-color: #000000;
      --card-bg: #ffffff;
      --widget-bg: #e2f4e3;
      --widget-text: #386a42;
      --border-color: #e8e8e8;
      --accent-color: #2481cc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #17212b;
        --text-color: #f5f5f5;
        --card-bg: #24303f;
        --widget-bg: #1c3222;
        --widget-text: #81c784;
        --border-color: #2f3c4c;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 16px;
      color: var(--text-color);
    }

    h1 { font-size: 24px; margin-bottom: 4px; }
    .subtitle { color: #708499; margin: 0 0 20px 0; font-size: 14px; }

    /* Widget Diretta Streaming dello Specchietto */
    .livestream-widget {
      background-color: var(--widget-bg);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .livestream-header { display: flex; justify-content: space-between; align-items: center; }
    .livestream-info h3 { margin: 0; font-size: 18px; }
    .livestream-info p { margin: 4px 0 0 0; font-size: 13px; color: var(--widget-text); }
    
    .btn-join {
      background-color: var(--accent-color);
      color: white; border: none; border-radius: 20px;
      padding: 8px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
    }

    /* Guida TV interna al Widget */
    .guidatv-box {
      background-color: rgba(0, 0, 0, 0.04);
      border-radius: 12px; padding: 10px 14px; margin-top: 12px; font-size: 13px;
    }
    .guidatv-title { font-weight: 700; font-size: 11px; color: var(--accent-color); text-transform: uppercase; margin-bottom: 4px; }

    .search-bar {
      margin-top: 14px; border-top: 1px solid rgba(0, 0, 0, 0.08); padding-top: 12px;
      display: flex; align-items: center;
    }
    .search-bar input { border: none; background: transparent; font-size: 15px; width: 100%; outline: none; color: var(--text-color); }

    /* Lista Canali con Loghi */
    .channel-list { background: var(--card-bg); border-radius: 16px; overflow: hidden; }
    .channel-item {
      padding: 12px 16px; border-bottom: 1px solid var(--border-color);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .channel-item:last-child { border-bottom: none; }
    
    .channel-left { display: flex; align-items: center; gap: 12px; }
    
    /* Stile per i loghi e fallbacks */
    .channel-logo {
      width: 40px; height: 40px; border-radius: 8px; object-fit: contain;
      background-color: #ffffff; border: 1px solid #e0e0e0;
    }
    .channel-avatar-placeholder {
      width: 40px; height: 40px; border-radius: 8px;
      background-color: var(--accent-color); color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 16px;
    }
    .channel-name { font-size: 15px; font-weight: 500; }
    .live-dot { color: #e53935; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .live-dot::before { content: "●"; color: #e53935; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Segnale</h1>
  <p class="subtitle">Canali live con palinsesto e loghi ufficiali</p>

  <div class="livestream-widget">
    <div class="livestream-header">
      <div class="livestream-info">
        <h3 id="current-channel-title">Rai 1</h3>
        <p id="viewer-count">1.420 spettatori</p>
      </div>
      <button class="btn-join" onclick="joinStream()">Unisciti</button>
    </div>
    
    <div class="guidatv-box">
      <div class="guidatv-title">In onda adesso 🕒</div>
      <div id="guidatv-content">TG Diretta Nazionale ed Edizione Straordinaria</div>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Cerca canale per nome..." oninput="filterChannels()">
    </div>
  </div>

  <div style="font-size: 14px; font-weight:600; margin-bottom:10px; color:#708499;">EMITTENTI NAZIONALI</div>
  <div class="channel-list" id="channels-container"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const m3uUrl = "https://githubusercontent.com";
    let allChannels = [];
    let activeUrl = "";

    const fakePrograms = [
      "TG1 Pomeriggio / Attualità", "Match Live - Campionato di Calcio",
      "Studio Aperto / Meteo", "Film d'Autore in Prima Visione HD",
      "Documentario Geo & Geo", "Serie TV Crime - S1 Ep.2"
    ];

    async function loadChannels() {
      try {
        const response = await fetch(m3uUrl);
        const text = await response.text();
        const lines = text.split('\n');
        
        let currentChannel = null;

        for (let line of lines) {
          line = line.trim();
          if (line.startsWith("#EXTINF:")) {
            // Estrazione del logo mediante l'attributo tvg-logo="..."
            const logoMatch = line.match(/tvg-logo="([^"]+)"/);
            const logoUrl = logoMatch ? logoMatch[1] : "";
            
            const nameIndex = line.lastIndexOf(',');
            const name = nameIndex !== -1 ? line.substring(nameIndex + 1).trim() : "Canale";
            
            currentChannel = { name: name, logo: logoUrl, url: "" };
          } else if (line.startsWith("http") && currentChannel) {
            currentChannel.url = line;
            allChannels.push(currentChannel);
            currentChannel = null;
          }
        }
        renderChannels(allChannels);
        if(allChannels.length > 0) selectChannel(allChannels[0].name, allChannels[0].url);
      } catch (e) {
        document.getElementById('channels-container').innerHTML = "<p style='padding:16px; text-align:center;'>Errore di sincronizzazione.</p>";
      }
    }

    function renderChannels(channels) {
      const container = document.getElementById('channels-container');
      container.innerHTML = channels.map(ch => {
        // Se il canale ha un logo usa il tag img, altrimenti un avatar con l'iniziale del nome
        const logoHTML = ch.logo 
          ? `<img class="channel-logo" src="${ch.logo}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"><div class="channel-avatar-placeholder" style="display:none;">${ch.name.charAt(0)}</div>`
          : `<div class="channel-avatar-placeholder">${ch.name.charAt(0)}</div>`;

        return `
          <div class="channel-item" onclick="selectChannel('${ch.name.replace(/'/g, "\\'")}', '${ch.url}')">
            <div class="channel-left">
              ${logoHTML}
              <span class="channel-name">${ch.name}</span>
            </div>
            <span class="live-dot">LIVE</span>
          </div>
        `;
      }).join('');
    }

    function selectChannel(name, url) {
      activeUrl = url;
      document.getElementById('current-channel-title').innerText = name;
      document.getElementById('viewer-count').innerText = `${(Math.floor(Math.random() * 4000) + 150).toLocaleString('it-IT')} spettatori`;
      document.getElementById('guidatv-content').innerText = fakePrograms[Math.floor(Math.random() * fakePrograms.length)];
    }

    function joinStream() {
      if(activeUrl) tg.openLink(activeUrl);
    }

    function filterChannels() {
      const q = document.getElementById('search-input').value.toLowerCase();
      renderChannels(allChannels.filter(ch => ch.name.toLowerCase().includes(q)));
    }

    window.onload = loadChannels;
  </script>
</body>
</html>
